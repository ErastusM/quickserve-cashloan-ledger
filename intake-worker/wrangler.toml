# QuickServe Cashloan — intake Worker configuration.
# Fill in the two REPLACE_ values after creating the D1 database (see README.md).
# Secrets (OWNER_TOKEN) are NOT stored here — set them with `wrangler secret put`.

name = "quickserve-intake"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# The origin your apply.html / inbox.html are served from (for CORS).
# The console now lives at https://admin.quickserve.group (GitHub Pages with a
# custom domain; the old github.io address redirects there). Run
# `npx wrangler deploy` after changing this.
ALLOWED_ORIGIN = "https://admin.quickserve.group"

[[d1_databases]]
binding = "DB"
database_name = "quickserve-intake"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "quickserve-docs"
