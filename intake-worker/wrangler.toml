# QuickServe Cashloan — intake Worker configuration.
# Fill in the two REPLACE_ values after creating the D1 database (see README.md).
# Secrets (OWNER_TOKEN) are NOT stored here — set them with `wrangler secret put`.

name = "quickserve-intake"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# Which site origin may call this Worker (CORS). Owner endpoints are gated by
# the token regardless of origin, and the apply form is public, so "*" is safe
# and lets both the GitHub Pages inbox and the Hostinger admin console
# (admin.quickserve.global) reach it. Set a single origin to lock it down later.
ALLOWED_ORIGIN = "*"

# WhatsApp Cloud API — auto-notify the applicant on approve/decline.
# The access TOKEN is a secret: `wrangler secret put WHATSAPP_TOKEN` (not here).
# See WHATSAPP.md. Leave WHATSAPP_PHONE_ID as-is to keep auto-send OFF.
WHATSAPP_PHONE_ID = "REPLACE_WITH_YOUR_PHONE_NUMBER_ID"
WA_TEMPLATE_APPROVED = "loan_approved"
WA_TEMPLATE_DECLINED = "loan_declined"
WA_LANG = "en"
WA_API_VERSION = "v21.0"

[[d1_databases]]
binding = "DB"
database_name = "quickserve-intake"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "quickserve-docs"
