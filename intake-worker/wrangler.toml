# QuickServe Cashloan — intake Worker configuration.
# Fill in the two REPLACE_ values after creating the D1 database (see README.md).
# Secrets (OWNER_TOKEN) are NOT stored here — set them with `wrangler secret put`.

name = "quickserve-intake"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# The origin your apply.html / inbox.html are served from (for CORS).
# For GitHub Pages this is your Pages origin, e.g. https://erastusm.github.io
ALLOWED_ORIGIN = "https://erastusm.github.io"
# Link included in the "new application" alert so you can jump straight to review.
INBOX_URL = "https://erastusm.github.io/quickserve-cashloan-ledger/inbox.html"

# ── New-application alerts (optional; set up ONE channel) ────────────────────
# Secrets are NOT stored here — set them with `wrangler secret put <NAME>`:
#   Telegram (instant phone push):  TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   Email (via Resend):             RESEND_API_KEY, OWNER_EMAIL  [, NOTIFY_FROM]
# If neither is set, the app still works — you just review from the inbox.

[[d1_databases]]
binding = "DB"
database_name = "quickserve-intake"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "quickserve-docs"
