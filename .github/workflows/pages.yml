name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Money maths gate the deploy: a wrong balance is worse than a late release.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Money maths tests
        run: node tests/money.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Only the admin console is published (see site/assemble.sh).
      - name: Assemble the site (admin console only)
        run: |
          sh site/assemble.sh
          touch _site/.nojekyll
          find _site -type f | sort

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # The same console for Hostinger, so admin.quickserve.group is served from
  # the same host as the rest of quickserve.group. Some mobile networks block or
  # intercept *.github.io (the "connection is not secure" error on mobile data
  # only); Hostinger is not affected. This job commits the published files to
  # the `hostinger` branch; Hostinger's Git deployment (hPanel -> Advanced ->
  # Git, auto-deploy webhook) pulls it into the subdomain's folder.
  hostinger:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site for Hostinger
        run: |
          sh site/assemble.sh
          cp site/.htaccess _site/.htaccess
          find _site -type f | sort

      - name: Publish to the hostinger branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh site/publish-hostinger.sh
