name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Money maths gate the deploy: a wrong balance is worse than a late release.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Money maths tests
        run: node tests/money.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Only the admin console is published. The phone app, apply form, old
      # inbox and documents stay in the repository but are no longer online.
      # site/ holds the redirect from the old address, a 404 page and the
      # service worker that retires the phone app's offline cache.
      - name: Assemble the site (admin console only)
        run: |
          rm -rf _site
          mkdir -p _site/admin
          cp admin/index.html _site/admin/index.html
          cp site/index.html site/404.html site/sw.js _site/
          touch _site/.nojekyll
          find _site -type f | sort

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
