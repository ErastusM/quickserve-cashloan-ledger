<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>QuickServe — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9; --inset:#eef1f3;
    --ink:#111a1d; --ink-2:#3e4a4f; --muted:#697479;
    --line:#e0e5e8; --line-2:#eceef1;
    --accent:#0e5b39; --accent-2:#0b6b42; --accent-soft:#e6efe9;
    --steel:#3a5a6b; --steel-soft:#e8eef1;
    --good:#0e7a4a; --good-soft:#e4f1ea; --warn:#8a6410; --warn-soft:#f2ecdb; --bad:#a93123; --bad-soft:#f6e6e3;
    --sidebar:#101a17; --sidebar-ink:#c9d4cf; --sidebar-ink-2:#8b9a93; --sidebar-active:#183028;
    --shadow:0 1px 2px rgba(17,26,29,.06);
    --radius:10px;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --ground:#0b1012; --surface:#131a1c; --surface-2:#0f1618; --inset:#0e1416;
    --ink:#e6ecee; --ink-2:#a4afb4; --muted:#76838a;
    --line:#222b2e; --line-2:#1a2225;
    --accent:#3bb27f; --accent-2:#54c491; --accent-soft:#122720;
    --steel:#6f95a8; --steel-soft:#16242b;
    --good:#4fbd84; --good-soft:#14251c; --warn:#c79a3f; --warn-soft:#251d10; --bad:#e0715f; --bad-soft:#2a1512;
    --sidebar:#0a1210; --sidebar-ink:#aebbb4; --sidebar-ink-2:#71807a; --sidebar-active:#15251f;
    --shadow:0 1px 2px rgba(0,0,0,.45);
  }}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--ground); color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; letter-spacing:-.006em; -webkit-font-smoothing:antialiased; font-size:14px;}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0; font-weight:800; letter-spacing:-.02em}
  a{color:var(--accent-2)}
  .hidden{display:none!important}
  button{font:inherit; cursor:pointer}

  /* ---------- login ---------- */
  .login-wrap{min-height:100%; display:grid; place-items:center; padding:24px}
  .login{width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:28px 24px; text-align:center}
  .brandmark{width:44px;height:44px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 12px}
  .login h1{font-size:20px} .login p{color:var(--muted); font-size:13px; margin:4px 0 16px}
  .fld{width:100%; font:inherit; font-size:15px; background:var(--surface-2); border:1.5px solid var(--line); border-radius:9px; padding:11px 12px; color:var(--ink); margin-bottom:10px}
  .fld:focus{outline:none; border-color:var(--accent)}
  .btn{border:none; border-radius:9px; padding:11px 15px; font-weight:700; font-size:14px; background:var(--accent); color:#fff}
  .btn.block{width:100%}
  .btn.ghost{background:var(--surface); border:1px solid var(--line); color:var(--ink)}
  .btn.sm{padding:7px 12px; font-size:13px}
  .msg{font-size:12.5px; min-height:16px; margin-top:10px}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--good)}

  /* ---------- shell ---------- */
  .shell{display:grid; grid-template-columns:232px 1fr; min-height:100vh}
  .scrim{display:none}  /* a fixed overlay only on mobile; never a grid cell on desktop */
  .side{background:var(--sidebar); color:var(--sidebar-ink); padding:16px 12px; display:flex; flex-direction:column; gap:2px; position:sticky; top:0; height:100vh}
  .side .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 16px}
  .side .brand .m{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
  .side .brand b{color:#fff; font-size:15px} .side .brand span{color:var(--sidebar-ink-2); font-weight:600; font-size:11px; display:block}
  .navitem{display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:8px; color:var(--sidebar-ink); font-weight:600; font-size:13.5px; text-decoration:none; background:none; border:none; width:100%; text-align:left}
  .navitem:hover{background:var(--sidebar-active); color:#fff}
  .navitem.active{background:var(--sidebar-active); color:#fff}
  .navitem .ic{width:18px;height:18px;flex:none;opacity:.9}
  .navitem .badge{margin-left:auto; background:var(--accent); color:#fff; font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px}
  .side .spacer{flex:1}
  .side .who{padding:10px 11px; border-top:1px solid rgba(255,255,255,.08); margin-top:6px; font-size:12px; color:var(--sidebar-ink-2)}
  .side .who b{color:#fff; display:block; font-size:12.5px; overflow:hidden; text-overflow:ellipsis}

  .main{min-width:0}
  .topbar{position:sticky; top:0; z-index:5; background:color-mix(in srgb,var(--surface) 88%,transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:12px}
  .topbar h2{font-size:18px} .topbar .sp{flex:1}
  .content{padding:24px 26px 60px; max-width:1160px}
  .menu-btn{display:none}

  /* ---------- components ---------- */
  .tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
  @media(max-width:1000px){ .tiles{grid-template-columns:repeat(2,1fr)} }
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 16px; box-shadow:var(--shadow)}
  .tile .k{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600}
  .tile .v{font-size:24px; font-weight:800; letter-spacing:-.02em; margin-top:6px}
  .tile .d{font-size:12px; color:var(--muted); margin-top:2px}
  .tile.good .v{color:var(--good)} .tile.accent .v{color:var(--accent)}

  .banner{border-radius:var(--radius); padding:13px 16px; font-size:13.5px; font-weight:600; margin-bottom:16px; display:flex; gap:10px; align-items:center; cursor:pointer; border:1px solid transparent}
  .banner.bad{background:var(--bad-soft); color:var(--bad); border-color:color-mix(in srgb,var(--bad) 26%,transparent)}
  .banner.warn{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 26%,transparent)}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-top:18px}
  .panel-head{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line)}
  .panel-head h3{font-size:14.5px} .panel-head .sp{flex:1}
  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
  .search{flex:1; min-width:180px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:8px 12px}
  .search input{border:none; background:none; font:inherit; color:var(--ink); width:100%; outline:none}
  .seg{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:3px}
  .seg button{border:none; background:none; color:var(--muted); font-weight:600; font-size:12.5px; padding:6px 11px; border-radius:6px}
  .seg button.on{background:var(--accent); color:#fff}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:10px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface)}
  td{padding:11px 16px; border-bottom:1px solid var(--line-2)}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  td.r,th.r{text-align:right; font-variant-numeric:tabular-nums}
  .who-cell b{font-weight:700} .who-cell span{display:block; color:var(--muted); font-size:12px}
  .table-scroll{overflow-x:auto}

  .pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 9px; border-radius:999px}
  .pill.active{color:var(--accent); background:var(--accent-soft)} .pill.paid{color:var(--good); background:var(--good-soft)}
  .pill.overdue{color:var(--bad); background:var(--bad-soft)} .pill.new{color:var(--steel); background:var(--steel-soft)}
  .pill.approved{color:var(--good); background:var(--good-soft)} .pill.declined{color:var(--bad); background:var(--bad-soft)} .pill.writtenoff{color:var(--muted); background:var(--surface-2)}

  .empty{padding:44px 20px; text-align:center; color:var(--muted); font-size:13.5px}
  .stub{background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius); padding:40px 24px; text-align:center; color:var(--muted)}
  .stub h3{color:var(--ink); font-size:16px; margin-bottom:6px}

  @media(max-width:820px){
    .shell{grid-template-columns:1fr}
    .side{position:fixed; z-index:30; width:232px; left:-244px; transition:left .18s; box-shadow:0 0 40px rgba(0,0,0,.3)}
    .side.open{left:0}
    .menu-btn{display:inline-grid; place-items:center; width:34px;height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surface)}
    .scrim{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20; display:none}
    .scrim.show{display:block}
    .content{padding:18px 16px 50px}
    .topbar{padding:12px 16px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap">
  <div class="login">
    <div class="brandmark">Q</div>
    <h1>QuickServe Admin</h1>
    <p>Sign in to review applications and run the loan book.</p>
    <input id="email" class="fld" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" class="fld" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="signInBtn" class="btn block">Sign in</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<!-- APP -->
<div id="appView" class="shell hidden">
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side">
    <div class="brand"><span class="m">Q</span><div><b>QuickServe</b><span>Admin console</span></div></div>
    <button class="navitem" data-route="dashboard"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>Dashboard</button>
    <button class="navitem" data-route="applications"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>Applications<span class="badge hidden" id="appsBadge"></span></button>
    <button class="navitem" data-route="clients"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M3 21a6 6 0 0 1 12 0"/><path d="M16 11a4 4 0 0 0 0-6"/></svg>Clients</button>
    <button class="navitem" data-route="loans"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>Loans</button>
    <button class="navitem" data-route="payments"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6"/><path d="M9 12h6"/></svg>Payments</button>
    <button class="navitem" data-route="reports"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-5"/><path d="M12 16V8"/><path d="M16 16v-3"/></svg>Reports</button>
    <div class="spacer"></div>
    <button class="navitem" data-route="settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Settings</button>
    <div class="who"><b id="whoEmail">—</b><button class="btn ghost sm" id="signOutBtn" style="margin-top:8px;width:100%">Sign out</button></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h2 id="pageTitle">Dashboard</h2>
      <span class="sp"></span>
      <button class="btn ghost sm" id="refreshBtn">Refresh</button>
    </div>
    <div class="content" id="content"><div class="empty">Loading…</div></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  // ---- config (public values) ----
  var SB = { url:"https://ptlwhpvzyfpxtpghwlqs.supabase.co", key:"sb_publishable_jy5bMPcZ9uIwXHV2M7Sq0g_5uYtWcZH" };
  var WORKER_BASE = "https://quickserve-intake.quickservefinance.workers.dev";
  var SESSION_KEY = "quickserve_cloud_v1";        // shared session shape with the app
  var OWNER_KEY = "qs_owner_token";               // for the intake Worker

  var $ = function(id){ return document.getElementById(id); };
  var state = { clients:[], loans:[], payments:[], expenses:[], capital:[], settings:{} };
  var rows = [];           // analyses
  var apps = null;         // applications cache
  var route = "dashboard";
  var ui = { loanFilter:"open", clientQ:"", loanQ:"", payQ:"" };

  // ---- helpers ----
  function num(v){ return Math.round((Number(v||0)+Number.EPSILON)*100)/100; }
  function money(v){ return "N$ " + num(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function money0(v){ return "N$ " + Math.round(num(v)).toLocaleString("en-US"); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function monthKey(iso){ return String(iso||"").slice(0,7); }
  function daysUntil(iso){ if(!iso) return 9999; return Math.ceil((new Date(iso+"T00:00:00") - new Date(todayISO()+"T00:00:00"))/86400000); }
  function fmtDate(iso){ if(!iso) return "—"; try{ return new Date(iso+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}catch(e){return iso;} }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];}); }
  function clientName(id){ var c=state.clients.find(function(x){return x.id===id;}); return c?c.name:"—"; }
  function clientPhone(id){ var c=state.clients.find(function(x){return x.id===id;}); return c?(c.phone||""):""; }

  // ---- analysis engine (mirrors the app's money maths) ----
  function analyse(){
    var today = todayISO();
    var byLoan = {};
    (state.payments||[]).forEach(function(p){ byLoan[p.loanId]=(byLoan[p.loanId]||0)+num(p.amount); });
    rows = (state.loans||[]).map(function(l){
      var rev = num(l.principal)*(num(l.interestRate)/100)+num(l.serviceFee);
      var totalDue = num(l.principal)+rev;
      var paid = byLoan[l.id]||0;
      var outstanding = Math.max(0, num(totalDue-paid));
      var revenueCollected = Math.min(paid, rev);
      var principalRecovered = Math.max(0, paid-rev);
      var principalOutstanding = Math.max(0, num(l.principal)-principalRecovered);
      var status;
      if (l.status==="written-off") status="written-off";
      else if (outstanding<=0.009) status="paid";
      else if (l.dueDate < today) status="overdue";
      else status="active";
      return { loan:l, rev:rev, totalDue:totalDue, paid:paid, outstanding:outstanding,
        revenueCollected:revenueCollected, principalOutstanding:principalOutstanding, status:status };
    });
  }
  function totals(){
    var capIn=0,capOut=0; (state.capital||[]).forEach(function(c){ if(c.direction==="in")capIn+=num(c.amount); else capOut+=num(c.amount); });
    var advanced=(state.loans||[]).reduce(function(s,l){return s+num(l.principal);},0);
    var collected=(state.payments||[]).reduce(function(s,p){return s+num(p.amount);},0);
    var open=rows.filter(function(r){return r.status==="active"||r.status==="overdue";});
    var outOnLoan=open.reduce(function(s,r){return s+r.principalOutstanding;},0);
    var receivable=open.reduce(function(s,r){return s+r.outstanding;},0);
    var cash=capIn-capOut+collected-advanced;
    var mo=monthKey(todayISO());
    var collectedMo=(state.payments||[]).filter(function(p){return monthKey(p.date)===mo;}).reduce(function(s,p){return s+num(p.amount);},0);
    var revenueAll=rows.reduce(function(s,r){return s+r.revenueCollected;},0);
    var activeClients=new Set(open.map(function(r){return r.loan.clientId;})).size;
    var overdue=open.filter(function(r){return r.status==="overdue";});
    return { cash:cash, outOnLoan:outOnLoan, totalFunds:cash+outOnLoan, receivable:receivable,
      collectedMo:collectedMo, revenueAll:revenueAll, activeClients:activeClients,
      overdueN:overdue.length, overdueAmt:overdue.reduce(function(s,r){return s+r.outstanding;},0), open:open };
  }

  // ---- Supabase auth + ledger ----
  function session(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||"null"); }catch(e){ return null; } }
  function setSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
  function api(path, opts){ opts=opts||{}; var h=Object.assign({apikey:SB.key,"Content-Type":"application/json"},opts.headers||{}); return fetch(SB.url+path,{method:opts.method||"GET",headers:h,body:opts.body}); }
  function storeToken(j,email){ var s=session()||{}; s.access_token=j.access_token; s.refresh_token=j.refresh_token; s.expires_at=Date.now()+(Number(j.expires_in||3600)*1000); s.email=email||(j.user&&j.user.email)||s.email; setSession(s); }
  function signIn(email,password){
    return api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:email,password:password})})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error_description||j.msg||"Sign in failed."); storeToken(j,email); }); });
  }
  function token(){
    var s=session(); if(!s||!s.access_token) return Promise.resolve(null);
    if(Date.now() < (s.expires_at||0)-60000) return Promise.resolve(s.access_token);
    return api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.refresh_token})})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) return null; storeToken(j,s.email); return j.access_token; }); })
      .catch(function(){ return null; });
  }
  function pullLedger(){
    return token().then(function(t){
      if(!t) return {auth:false};
      return api("/rest/v1/ledger?id=eq.main&select=data",{headers:{Authorization:"Bearer "+t}})
        .then(function(r){ if(!r.ok) return {error:"read "+r.status}; return r.json().then(function(a){ return {row:a[0]||null}; }); });
    });
  }

  // ---- Applications (intake Worker) ----
  function ownerToken(){ return localStorage.getItem(OWNER_KEY)||""; }
  function loadApps(){
    var tk=ownerToken();
    if(!tk) return Promise.resolve({needOwner:true});
    return fetch(WORKER_BASE+"/applications",{headers:{Authorization:"Bearer "+tk}})
      .then(function(r){ if(r.status===401) return {needOwner:true,bad:true}; if(!r.ok) return {error:r.status}; return r.json(); })
      .catch(function(){ return {error:"offline"}; });
  }

  // ---- routing / render ----
  var TITLES={dashboard:"Dashboard",applications:"Applications",clients:"Clients",loans:"Loans",payments:"Payments",reports:"Reports",settings:"Settings"};
  function go(r){
    route=r; location.hash=r;
    Array.prototype.forEach.call(document.querySelectorAll(".navitem"),function(b){ b.classList.toggle("active", b.dataset.route===r); });
    $("pageTitle").textContent=TITLES[r]||"Admin";
    $("side").classList.remove("open"); $("scrim").classList.remove("show");
    render();
  }
  function render(){
    var c=$("content");
    if(route==="dashboard") return renderDashboard(c);
    if(route==="clients") return renderClients(c);
    if(route==="loans") return renderLoans(c);
    if(route==="payments") return renderPayments(c);
    if(route==="applications") return renderApplications(c);
    if(route==="reports") return stub(c,"Reports","Monthly & yearly figures, projections and the investor one-pager land here next.");
    if(route==="settings") return stub(c,"Settings","Rates, fees, company details, staff roles and message templates — coming next.");
  }
  function stub(c,t,d){ c.innerHTML='<div class="stub"><h3>'+esc(t)+'</h3><p>'+esc(d)+'</p></div>'; }

  function renderDashboard(c){
    var t=totals();
    var due=t.open.filter(function(r){return daysUntil(r.loan.dueDate)<=1;});
    var byClient={}; t.open.forEach(function(r){ byClient[r.loan.clientId]=(byClient[r.loan.clientId]||0)+r.outstanding; });
    var topId=null,topAmt=0; Object.keys(byClient).forEach(function(id){ if(byClient[id]>topAmt){topAmt=byClient[id];topId=id;} });
    var share=t.receivable>0?topAmt/t.receivable:0;
    var html="";
    if(due.length){ html+='<div class="banner bad" data-goloans>⏰ '+due.length+' loan'+(due.length>1?"s":"")+' due within a day — '+money0(due.reduce(function(s,r){return s+r.outstanding;},0))+' to collect. Open them →</div>'; }
    if(share>=0.25 && t.receivable>5000){ html+='<div class="banner warn">⚠ Single-borrower risk: '+esc(clientName(topId))+' holds '+Math.round(share*100)+'% of the book ('+money0(topAmt)+').</div>'; }
    html+='<div class="tiles">'
      + tile("Cash on hand", money0(t.cash), "in the float")
      + tile("Out on loan", money0(t.outOnLoan), "principal deployed")
      + tile("Total funds", money0(t.totalFunds), "cash + on loan","accent")
      + tile("Receivable", money0(t.receivable), "still collectable")
      + tile("Collected (mo)", money0(t.collectedMo), monthLabel())
      + tile("Revenue (all-time)", money0(t.revenueAll), "interest + fees","good")
      + tile("Active clients", String(t.activeClients), (state.clients.length)+" total")
      + tile("Overdue", money0(t.overdueAmt), t.overdueN+" loan"+(t.overdueN===1?"":"s"))
      + '</div>';
    c.innerHTML=html;
    var g=c.querySelector("[data-goloans]"); if(g) g.addEventListener("click",function(){ ui.loanFilter="open"; go("loans"); });
  }
  function tile(k,v,d,cls){ return '<div class="tile '+(cls||"")+'"><div class="k">'+esc(k)+'</div><div class="v num">'+esc(v)+'</div><div class="d">'+esc(d)+'</div></div>'; }
  function monthLabel(){ try{ return new Date().toLocaleDateString("en-GB",{month:"long"}); }catch(e){ return "this month"; } }

  function renderClients(c){
    var q=ui.clientQ.toLowerCase();
    var list=state.clients.filter(function(cl){ return [cl.ref,cl.name,cl.phone,cl.nationalId,cl.employer].join(" ").toLowerCase().indexOf(q)>=0; })
      .sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
    var body=list.map(function(cl){
      var open=rows.filter(function(r){return r.loan.clientId===cl.id && (r.status==="active"||r.status==="overdue");});
      var out=open.reduce(function(s,r){return s+r.outstanding;},0);
      return '<tr><td class="who-cell"><b>'+esc(cl.name||"—")+'</b><span>'+esc(cl.ref||"")+(cl.ref&&(cl.phone)?" · ":"")+esc(cl.phone||"")+'</span></td>'
        +'<td>'+esc(cl.nationalId||"<span style=\'color:var(--bad)\'>missing</span>")+'</td>'
        +'<td>'+esc(cl.employer||"—")+'</td>'
        +'<td class="r num">'+open.length+'</td>'
        +'<td class="r num">'+(out>0?money0(out):"—")+'</td></tr>';
    }).join("");
    c.innerHTML = toolbar("clientQ","Search name, ref, phone, ID…")
      + panel("Clients ("+list.length+")",
          '<div class="table-scroll"><table><thead><tr><th>Client</th><th>National ID</th><th>Employer</th><th class="r">Open</th><th class="r">Outstanding</th></tr></thead><tbody>'
          + (body||'<tr><td colspan="5" class="empty">No clients.</td></tr>') + '</tbody></table></div>');
    wireSearch("clientQ");
  }

  function renderLoans(c){
    var q=ui.loanQ.toLowerCase(), f=ui.loanFilter;
    var list=rows.filter(function(r){
      var st = f==="all" || r.status===f || (f==="open"&&(r.status==="active"||r.status==="overdue"));
      var hit=[r.loan.ref,clientName(r.loan.clientId),r.loan.purpose,r.status,r.loan.principal].join(" ").toLowerCase().indexOf(q)>=0;
      return st&&hit;
    }).sort(function(a,b){ return String(a.loan.dueDate).localeCompare(String(b.loan.dueDate)); });
    var body=list.map(function(r){
      return '<tr><td class="who-cell"><b>'+esc(clientName(r.loan.clientId))+'</b><span>'+esc(r.loan.ref||"")+(r.loan.purpose?" · "+esc(r.loan.purpose):"")+'</span></td>'
        +'<td class="r num">'+money0(r.loan.principal)+'</td>'
        +'<td class="num">'+fmtDate(r.loan.dueDate)+'</td>'
        +'<td class="r num">'+(r.outstanding>0?money0(r.outstanding):"—")+'</td>'
        +'<td><span class="pill '+(r.status==="written-off"?"writtenoff":r.status)+'">'+(r.status==="written-off"?"written off":r.status)+'</span></td></tr>';
    }).join("");
    var segs=[["open","Open"],["active","Active"],["overdue","Overdue"],["paid","Paid"],["all","All"]];
    c.innerHTML='<div class="toolbar"><div class="seg">'
      + segs.map(function(s){return '<button data-lf="'+s[0]+'" class="'+(f===s[0]?"on":"")+'">'+s[1]+'</button>';}).join("")
      + '</div><div class="search"><input id="q_loanQ" placeholder="Search loans…" value="'+esc(ui.loanQ)+'"></div></div>'
      + panel("Loans ("+list.length+")",
        '<div class="table-scroll"><table><thead><tr><th>Client</th><th class="r">Principal</th><th>Due</th><th class="r">Outstanding</th><th>Status</th></tr></thead><tbody>'
        + (body||'<tr><td colspan="5" class="empty">No loans in this view.</td></tr>') + '</tbody></table></div>');
    Array.prototype.forEach.call(c.querySelectorAll("[data-lf]"),function(b){ b.addEventListener("click",function(){ ui.loanFilter=b.dataset.lf; render(); }); });
    wireSearch("loanQ");
  }

  function renderPayments(c){
    var q=ui.payQ.toLowerCase();
    var list=(state.payments||[]).slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); })
      .map(function(p){ var loan=state.loans.find(function(l){return l.id===p.loanId;}); return {p:p, name: loan?clientName(loan.clientId):"—"}; })
      .filter(function(x){ return [x.name,x.p.method,x.p.reference,x.p.amount].join(" ").toLowerCase().indexOf(q)>=0; });
    var body=list.map(function(x){
      return '<tr><td class="who-cell"><b>'+esc(x.name)+'</b><span>'+esc(x.p.method||"")+(x.p.reference?" · "+esc(x.p.reference):"")+'</span></td>'
        +'<td class="num">'+fmtDate(x.p.date)+'</td>'
        +'<td class="r num">'+money0(x.p.amount)+'</td></tr>';
    }).join("");
    c.innerHTML=toolbar("payQ","Search payments…")
      + panel("Payments ("+list.length+")",
        '<div class="table-scroll"><table><thead><tr><th>Client</th><th>Date</th><th class="r">Amount</th></tr></thead><tbody>'
        + (body||'<tr><td colspan="3" class="empty">No payments.</td></tr>') + '</tbody></table></div>');
    wireSearch("payQ");
  }

  function renderApplications(c){
    c.innerHTML='<div class="empty">Loading applications…</div>';
    loadApps().then(function(res){
      if(res && res.needOwner){
        c.innerHTML='<div class="stub"><h3>Connect the applications inbox</h3><p>Enter the owner password for the intake service to load loan requests here.</p>'
          +'<div style="max-width:320px;margin:14px auto 0"><input id="ownerPw" class="fld" type="password" placeholder="Owner password"'+(res.bad?' style="border-color:var(--bad)"':'')+'>'
          +'<button class="btn block" id="ownerBtn">Connect</button></div></div>';
        $("ownerBtn").addEventListener("click",function(){ var v=$("ownerPw").value.trim(); if(!v) return; localStorage.setItem(OWNER_KEY,v); renderApplications(c); });
        $("ownerPw").addEventListener("keydown",function(e){ if(e.key==="Enter") $("ownerBtn").click(); });
        return;
      }
      if(res && res.error){ c.innerHTML='<div class="empty">Could not reach the applications service ('+esc(res.error)+').</div>'; return; }
      apps=(res&&res.applications)||[];
      var nnew=apps.filter(function(a){return a.status==="new";}).length;
      var badge=$("appsBadge"); if(nnew){ badge.textContent=nnew; badge.classList.remove("hidden"); } else badge.classList.add("hidden");
      var body=apps.map(function(a){
        return '<tr><td class="who-cell"><b>'+esc(a.full_name||"—")+'</b><span>'+esc(a.phone||"")+(a.purpose?" · "+esc(a.purpose):"")+'</span></td>'
          +'<td class="num">'+fmtDate((a.created_at||"").slice(0,10))+'</td>'
          +'<td>'+esc(a.employer||"—")+'</td>'
          +'<td><span class="pill '+esc(a.status)+'">'+esc(a.status)+'</span></td></tr>';
      }).join("");
      c.innerHTML=panel("Applications ("+apps.length+")",
        '<div class="table-scroll"><table><thead><tr><th>Applicant</th><th>Received</th><th>Employer</th><th>Status</th></tr></thead><tbody>'
        + (body||'<tr><td colspan="4" class="empty">No applications yet.</td></tr>') + '</tbody></table></div>');
    });
  }

  // small view helpers
  function panel(title,inner){ return '<div class="panel"><div class="panel-head"><h3>'+esc(title)+'</h3></div>'+inner+'</div>'; }
  function toolbar(key,ph){ return '<div class="toolbar"><div class="search"><input id="q_'+key+'" placeholder="'+esc(ph)+'" value="'+esc(ui[key])+'"></div></div>'; }
  function wireSearch(key){ var el=$("q_"+key); if(!el) return; el.addEventListener("input",function(){ ui[key]=el.value; var pos=el.selectionStart; render(); var n=$("q_"+key); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } }); }

  // ---- boot ----
  function showApp(){ $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden"); $("whoEmail").textContent=(session()||{}).email||"signed in"; loadData(); }
  function loadData(){
    $("content").innerHTML='<div class="empty">Loading your loan book…</div>';
    pullLedger().then(function(res){
      if(res.auth===false){ signOut(); return; }
      if(res.error){ $("content").innerHTML='<div class="empty">Couldn’t load the loan book ('+esc(res.error)+'). Try Refresh.</div>'; return; }
      var data=(res.row&&res.row.data)||{clients:[],loans:[],payments:[],capital:[],settings:{}};
      state=Object.assign({clients:[],loans:[],payments:[],expenses:[],capital:[],settings:{}},data);
      analyse();
      var r=(location.hash||"#dashboard").replace("#",""); if(!TITLES[r]) r="dashboard";
      go(r);
    });
  }
  function signOut(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} location.reload(); }

  // events
  $("signInBtn").addEventListener("click",function(){
    var email=$("email").value.trim(), pw=$("password").value;
    if(!email||pw.length<6){ msg("Enter your email and password.","err"); return; }
    msg("Signing in…","");
    signIn(email,pw).then(function(){ showApp(); }).catch(function(e){ msg(e.message||"Sign in failed.","err"); });
  });
  $("password").addEventListener("keydown",function(e){ if(e.key==="Enter") $("signInBtn").click(); });
  function msg(t,cls){ var m=$("loginMsg"); m.textContent=t; m.className="msg "+(cls||""); }
  $("signOutBtn").addEventListener("click",signOut);
  $("refreshBtn").addEventListener("click",loadData);
  $("menuBtn").addEventListener("click",function(){ $("side").classList.toggle("open"); $("scrim").classList.toggle("show"); });
  $("scrim").addEventListener("click",function(){ $("side").classList.remove("open"); $("scrim").classList.remove("show"); });
  Array.prototype.forEach.call(document.querySelectorAll(".navitem"),function(b){ b.addEventListener("click",function(){ go(b.dataset.route); }); });
  window.addEventListener("hashchange",function(){ var r=(location.hash||"").replace("#",""); if(TITLES[r]&&r!==route) go(r); });

  // start
  if((session()||{}).access_token) showApp(); else $("email").focus();

  // expose for local testing
  window.__admin = { setState:function(d){ state=Object.assign(state,d); analyse(); }, go:go, render:render };
})();
</script>
</body>
</html>
