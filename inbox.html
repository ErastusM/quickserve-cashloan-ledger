<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a5f38" />
  <meta name="robots" content="noindex" />
  <title>QuickServe — Applications</title>
  <style>
    :root{
      --paper:#f4f6f1;--card:#fff;--ink:#15201a;--muted:#566258;--line:#dce2d6;
      --accent:#0a5f38;--accent-ink:#0a5f38;--field:#fbfcfa;
      --new:#0a5f38;--new-bg:#e6f0e7;--ok:#2f7d4f;--ok-bg:#e6f0e7;--no:#a3341f;--no-bg:#f7e7e3;
      --shadow:0 1px 2px rgba(21,32,26,.05),0 10px 30px rgba(21,32,26,.08);
    }
    @media (prefers-color-scheme:dark){:root{
      --paper:#0d1310;--card:#161e19;--ink:#e9ece7;--muted:#9aa89e;--line:#2a342d;
      --accent:#4cc085;--accent-ink:#6bd39c;--field:#101711;
      --new:#6bd39c;--new-bg:#16281d;--ok:#5fc487;--ok-bg:#16281d;--no:#ef7a63;--no-bg:#2b1713;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45);
    }}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--paper);color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased;}
    .tnum{font-variant-numeric:tabular-nums;}
    .wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px;}

    header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;font-family:Georgia,serif;}
    header b{font-size:17px;}
    header .sp{flex:1;}
    .ibtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;}

    .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;}
    .tabs button{flex:1;border:none;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:8px 6px;border-radius:9px;cursor:pointer;}
    .tabs button.active{background:var(--accent);color:#fff;}
    .tabs button .n{opacity:.7;font-size:11px;}

    .list{display:flex;flex-direction:column;gap:10px;}
    .cardx{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:12px;align-items:flex-start;}
    .cardx:hover{border-color:var(--accent);}
    .cardx .main{flex:1;min-width:0;}
    .cardx .name{font-weight:700;font-size:15px;}
    .cardx .meta{color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:4px 9px;border-radius:999px;white-space:nowrap;}
    .pill.new{color:var(--new);background:var(--new-bg);}
    .pill.approved{color:var(--ok);background:var(--ok-bg);}
    .pill.declined{color:var(--no);background:var(--no-bg);}
    .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;}

    /* modal */
    .scrim{position:fixed;inset:0;background:rgba(10,16,12,.5);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center;z-index:20;}
    .scrim.show{display:flex;}
    .modal{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px 30px;}
    @media(min-width:560px){.scrim{align-items:center;}.modal{border-radius:18px;}}
    .modal h2{margin:0;font-family:Georgia,serif;font-size:22px;}
    .modal .ref{color:var(--muted);font-size:12.5px;margin:2px 0 14px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
    .fieldx{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;}
    .fieldx .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
    .fieldx .v{font-size:14px;margin-top:2px;word-break:break-word;}
    .fieldx.wide{grid-column:1 / -1;}
    .subh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:6px 0 8px;}
    .docs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
    .docbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center;}
    .docbtn:hover{border-color:var(--accent);}
    .actions{display:flex;gap:10px;margin-top:8px;}
    .actions button{flex:1;border:none;border-radius:11px;padding:13px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;}
    .approve{background:var(--accent);color:#fff;}
    .decline{background:var(--no-bg);color:var(--no);}
    .after{display:none;margin-top:14px;flex-direction:column;gap:10px;}
    .after.show{display:flex;}
    .after a,.after button{display:block;text-align:center;text-decoration:none;border-radius:11px;padding:13px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;border:none;}
    .wa{background:#25d366;color:#062e15;}
    .copy{background:var(--card);border:1px solid var(--line)!important;color:var(--ink);}
    .closex{position:absolute;}
    .modalHead{display:flex;align-items:flex-start;gap:10px;}
    .modalHead .x{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;padding:0 4px;}

    /* login */
    .login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px;box-shadow:var(--shadow);text-align:center;}
    .login .logo{margin:0 auto 12px;width:44px;height:44px;font-size:22px;}
    .login h1{font-family:Georgia,serif;font-size:22px;margin:0 0 4px;}
    .login p{color:var(--muted);font-size:13px;margin:0 0 16px;}
    .login input{width:100%;font:inherit;font-size:16px;background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);}
    .login input:focus{outline:none;border-color:var(--accent);}
    .login button{width:100%;margin-top:12px;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:13px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;}
    .login .err{color:var(--no);font-size:12.5px;margin-top:10px;min-height:16px;}
    .hidden{display:none!important;}
  </style>
</head>
<body>
  <!-- Login -->
  <div id="login" class="login">
    <div class="logo">Q</div>
    <h1>QuickServe Applications</h1>
    <p>Enter your owner password to view loan requests.</p>
    <input id="tokenInput" type="password" placeholder="Owner password" autocomplete="current-password" />
    <button id="loginBtn">Open inbox</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- App -->
  <div id="app" class="wrap hidden">
    <header>
      <span class="logo">Q</span><b>Applications</b>
      <span class="sp"></span>
      <button class="ibtn" id="refreshBtn">Refresh</button>
      <button class="ibtn" id="signout">Sign out</button>
    </header>
    <div class="tabs" id="tabs">
      <button data-status="new" class="active">New <span class="n" id="c-new"></span></button>
      <button data-status="approved">Approved</button>
      <button data-status="declined">Declined</button>
      <button data-status="">All</button>
    </div>
    <div class="list" id="list"></div>
  </div>

  <!-- Detail modal -->
  <div class="scrim" id="scrim">
    <div class="modal" id="modal"></div>
  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────────────────────
    // Set to your deployed Worker URL (no trailing slash). See intake-worker/README.md.
    const WORKER_BASE = ""; // e.g. "https://quickserve-intake.<you>.workers.dev"
    // ────────────────────────────────────────────────────────────────────────

    const TKEY = "qs_owner_token";
    let token = localStorage.getItem(TKEY) || "";
    let filter = "new";

    const $ = (id) => document.getElementById(id);
    const authHeaders = () => ({ Authorization: "Bearer " + token });

    // ---- auth / boot ----
    if (!WORKER_BASE) { $("loginErr").textContent = "Set WORKER_BASE in inbox.html first."; }
    if (token) verifyAndOpen();

    $("loginBtn").addEventListener("click", tryLogin);
    $("tokenInput").addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
    async function tryLogin(){
      token = $("tokenInput").value.trim();
      if (!token) return;
      $("loginErr").textContent = "Checking…";
      const ok = await verify();
      if (ok){ localStorage.setItem(TKEY, token); openApp(); }
      else { $("loginErr").textContent = "Wrong password, or the Worker isn't reachable."; }
    }
    async function verify(){
      try { const r = await fetch(`${WORKER_BASE}/applications?status=new`, { headers: authHeaders() }); return r.ok; }
      catch { return false; }
    }
    async function verifyAndOpen(){ if (await verify()) openApp(); else { token=""; localStorage.removeItem(TKEY); } }
    function openApp(){ $("login").classList.add("hidden"); $("app").classList.remove("hidden"); load(); }
    $("signout").addEventListener("click", () => { localStorage.removeItem(TKEY); location.reload(); });

    // ---- list ----
    $("refreshBtn").addEventListener("click", load);
    $("tabs").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-status]"); if (!b) return;
      filter = b.dataset.status;
      [...$("tabs").children].forEach(x => x.classList.toggle("active", x === b));
      load();
    });

    async function load(){
      $("list").innerHTML = `<div class="empty">Loading…</div>`;
      const url = `${WORKER_BASE}/applications` + (filter ? `?status=${filter}` : "");
      let data;
      try { const r = await fetch(url, { headers: authHeaders() }); data = await r.json(); }
      catch { $("list").innerHTML = `<div class="empty">Could not reach the server.</div>`; return; }
      const apps = data.applications || [];
      render(apps);
      if (filter === "new") $("c-new").textContent = apps.length ? `(${apps.length})` : "";
    }

    function render(apps){
      if (!apps.length){ $("list").innerHTML = `<div class="empty">No ${filter || ""} applications.</div>`; return; }
      $("list").innerHTML = apps.map(a => `
        <div class="cardx" data-id="${esc(a.id)}">
          <div class="main">
            <div class="name">${esc(a.full_name || "—")}</div>
            <div class="meta">${esc(a.purpose || "")} · ${esc(a.phone || "")} · ${fmtDate(a.created_at)}</div>
          </div>
          <span class="pill ${a.status}">${a.status}</span>
        </div>`).join("");
      [...$("list").querySelectorAll(".cardx")].forEach(el => el.addEventListener("click", () => openDetail(el.dataset.id)));
    }

    // ---- detail ----
    async function openDetail(id){
      $("scrim").classList.add("show");
      $("modal").innerHTML = `<div class="empty">Loading…</div>`;
      let a;
      try { const r = await fetch(`${WORKER_BASE}/applications/${id}`, { headers: authHeaders() }); a = (await r.json()).application; }
      catch { $("modal").innerHTML = `<div class="empty">Could not load.</div>`; return; }
      if (!a){ $("modal").innerHTML = `<div class="empty">Not found.</div>`; return; }

      const bankBtns = Array.from({length: a.doc_bank_count || 0}, (_, i) =>
        `<button class="docbtn" data-doc="bank" data-n="${i}">📄 Bank ${a.doc_bank_count>1?(i+1):""}</button>`).join("");

      $("modal").innerHTML = `
        <div class="modalHead">
          <div style="flex:1">
            <h2>${esc(a.full_name || "—")}</h2>
            <div class="ref">Ref ${esc(a.id)} · ${fmtDate(a.created_at)} · <span class="pill ${a.status}" style="font-size:10px">${a.status}</span></div>
          </div>
          <button class="x" id="closeModal" aria-label="Close">×</button>
        </div>
        <div class="grid">
          ${fieldx("Phone", a.phone)}
          ${fieldx("National ID", a.national_id)}
          ${fieldx("Employer / income", a.employer)}
          ${fieldx("Monthly income", a.income ? "N$ " + a.income : "—")}
          ${fieldx("Purpose of funds", a.purpose, true)}
          ${fieldx("Wants to repay by", fmtDay(a.repay_date))}
          ${fieldx("Next of kin", (a.kin_name || "—") + (a.kin_phone ? " · " + a.kin_phone : ""), true)}
          ${a.address ? fieldx("Address", a.address, true) : ""}
          ${a.decided_note ? fieldx("Note", a.decided_note, true) : ""}
        </div>
        <div class="subh">Documents</div>
        <div class="docs">
          <button class="docbtn" data-doc="id">🪪 ID copy</button>
          <button class="docbtn" data-doc="payslip">🧾 Payslip</button>
          ${bankBtns}
        </div>
        <div class="actions">
          <button class="decline" id="btnDecline">Decline</button>
          <button class="approve" id="btnApprove">Approve</button>
        </div>
        <div class="after" id="after"></div>`;

      $("closeModal").addEventListener("click", closeModal);
      $("modal").querySelectorAll(".docbtn").forEach(b =>
        b.addEventListener("click", () => viewDoc(a.id, b.dataset.doc, b.dataset.n)));
      $("btnApprove").addEventListener("click", () => decide(a, "approved"));
      $("btnDecline").addEventListener("click", () => decide(a, "declined"));
    }

    $("scrim").addEventListener("click", (e) => { if (e.target === $("scrim")) closeModal(); });
    function closeModal(){ $("scrim").classList.remove("show"); }

    async function viewDoc(id, doc, n){
      const url = `${WORKER_BASE}/applications/${id}/file/${doc}` + (n != null ? `/${n}` : "");
      try {
        const r = await fetch(url, { headers: authHeaders() });
        if (!r.ok) throw new Error();
        const blob = await r.blob();
        const obj = URL.createObjectURL(blob);
        window.open(obj, "_blank");
        setTimeout(() => URL.revokeObjectURL(obj), 60000);
      } catch { alert("Could not open the document."); }
    }

    async function decide(a, status){
      let note = "";
      if (status === "declined") { note = prompt("Optional note / reason (the applicant won't see this):") || ""; }
      try {
        const r = await fetch(`${WORKER_BASE}/applications/${a.id}/status`, {
          method: "POST", headers: { ...authHeaders(), "Content-Type": "application/json" },
          body: JSON.stringify({ status, note })
        });
        if (!r.ok) throw new Error();
      } catch { alert("Could not save. Try again."); return; }

      a.status = status; a.decided_note = note;
      const msg = status === "approved"
        ? `Hi ${a.full_name}, good news — your QuickServe Cashloan request (${a.id}) has been approved. We'll be in touch shortly with the details. Thank you!`
        : `Hi ${a.full_name}, thank you for your QuickServe Cashloan application (${a.id}). Unfortunately we're unable to approve it at this time. You're welcome to apply again in future.`;
      const after = $("after");
      after.innerHTML = `
        <a class="wa" href="${waLink(a.phone, msg)}" target="_blank" rel="noopener">Reply to ${esc(firstName(a.full_name))} on WhatsApp</a>
        <button class="copy" id="copyBtn">Copy details for the loan book</button>`;
      after.classList.add("show");
      $("copyBtn").addEventListener("click", () => copySummary(a));
      const actionsRow = document.querySelector(".actions");
      if (actionsRow) actionsRow.style.display = "none";
    }

    function copySummary(a){
      const text = [
        a.full_name, `Phone: ${a.phone}`, `ID: ${a.national_id}`,
        a.address ? `Address: ${a.address}` : "", `Employer: ${a.employer}`,
        a.income ? `Income: N$ ${a.income}` : "", `Next of kin: ${a.kin_name} (${a.kin_phone})`,
        `Purpose: ${a.purpose}`, `Wants to repay by: ${fmtDay(a.repay_date)}`, `Ref: ${a.id}`
      ].filter(Boolean).join("\n");
      navigator.clipboard?.writeText(text).then(
        () => { const b = $("copyBtn"); if (b){ b.textContent = "Copied ✓"; setTimeout(()=>b.textContent="Copy details for the loan book",1800); } },
        () => alert("Copy failed — here it is:\n\n" + text)
      );
    }

    // ---- helpers ----
    function waLink(phone, text){ return `https://wa.me/${normPhone(phone)}?text=${encodeURIComponent(text)}`; }
    function normPhone(v){
      let d = String(v || "").replace(/\D/g, "");
      if (d.startsWith("00")) d = d.slice(2);
      if (d.startsWith("264")) return d;
      if (d.startsWith("0")) return "264" + d.slice(1);
      if (d.length === 9) return "264" + d;
      return d;
    }
    function fieldx(k, v, wide){ return `<div class="fieldx ${wide?"wide":""}"><div class="k">${esc(k)}</div><div class="v">${esc(v || "—")}</div></div>`; }
    function firstName(n){ return String(n || "").trim().split(/\s+/)[0] || "them"; }
    function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
    function fmtDate(iso){ try { return new Date(iso).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); } catch { return iso || ""; } }
    function fmtDay(iso){ if(!iso) return "—"; try { return new Date(iso+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); } catch { return iso; } }
  </script>
</body>
</html>
